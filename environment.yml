name: syn
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - librosa              # STFT, chroma, CQT
  - python-sounddevice   # streaming audio capture (PortAudio)
  - pygame               # visualization window
  - matplotlib-base      # plots (no Qt: pygame draws the windows)
  - ipython
# conda's alsa-lib does not see the system PipeWire plugin, so PortAudio
# finds no devices. Point it at the system paths (Fedora: lib64).
variables:
  ALSA_CONFIG_DIR: /usr/share/alsa
  ALSA_PLUGIN_DIR: /usr/lib64/alsa-lib
